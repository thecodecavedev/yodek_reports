name: Refresh support summary

on:
  schedule:
    # Times are UTC. SAST is UTC+2, so 05:00-16:59 UTC is 07:00-18:59 SAST.
    - cron: "*/5 5-16 * * 1-5"   # every 15 minutes, weekday support hours
    # - cron: "0 */3 * * *"         # every 3 hours otherwise, so weekends stay roughly current
  workflow_dispatch:              # "Run workflow" button for a manual refresh
  push:
    branches: [main]              # redeploy when the page or script changes

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:                      # never let two refreshes overlap
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Pull figures from Intercom
        env:
          INTERCOM_TOKEN: ${{ secrets.INTERCOM_TOKEN }}
          INTERCOM_REGION: us
          HIDE_CUSTOMERS: "false"
        run: node ./fetch-data.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./
          name: github-pages-${{ github.run_attempt }}

      - id: deploy
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
